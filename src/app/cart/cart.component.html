<div class="container mt-5">
  <h1 class="text-center mb-4" style="color: darkred; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ; background-color: aquamarine;" >My Cart</h1>
  <div *ngIf="leadId; else noLead">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
      <div class="card-body">
        <div *ngIf="cartItems.length > 0; else emptyCart">
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of cartItems">
              <div>
                <h5 class="my-0">{{ item.name }} ({{ item.type }})</h5>
                <!-- <small class="text-muted">{{ item.description }}</small> -->
              </div>
              <span class="text-primary fw-bold">₹{{ item.price | number:'1.2-2' }}</span>
            </li>
          </ul>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <h4 class="my-0">Total</h4>
            <h3 class="text-success fw-bold">₹{{ cartTotal | number:'1.2-2' }}</h3> 
          </div>
          <hr>
          <div class="d-grid">
            <button class="btn btn-success" (click)="onFinalizeBooking()">Proceed to Payment</button>
          </div>
        </div>
        <ng-template #emptyCart>
          <div class="alert alert-info text-center my-3">
            Your cart is empty. Please go back and add a service.
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <ng-template #noLead>
    <div class="alert alert-warning text-center mt-5">
      Please verify your email or a problem occurred.
    </div>
  </ng-template>
</div>
