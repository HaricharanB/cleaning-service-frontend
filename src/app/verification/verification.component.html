<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg border-0 rounded-4 p-4 text-center" style="max-width: 420px; width: 100%;">
    
    <!-- Verifying -->
    <div *ngIf="verificationStatus === 'verifying'">
      <div class="mb-3">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      </div>
      <h4 class="fw-bold text-dark">Verifying your email...</h4>
      <p class="text-muted">Please wait, this may take a moment.</p>
    </div>

    <!-- Success -->
    <div *ngIf="verificationStatus === 'success'">
      <div class="mb-3 text-success">
        <i class="bi bi-check-circle-fill display-4"></i>
      </div>
      <h4 class="fw-bold text-success">Success!</h4>
      <p class="text-muted">Your email has been successfully verified.<br> Redirecting to your cart...</p>
    </div>

    <!-- Error -->
    <div *ngIf="verificationStatus === 'error'">
      <div class="mb-3 text-danger">
        <i class="bi bi-x-circle-fill display-4"></i>
      </div>
      <h4 class="fw-bold text-danger">Error!</h4>
      <p class="text-muted">The verification link is invalid or has expired. Please try again.</p>
    </div>

  </div>
</div>

<router-outlet></router-outlet>
