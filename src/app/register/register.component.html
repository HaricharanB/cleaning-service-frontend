<div class="container mt-5">
  <div class="card mx-auto shadow-lg border-0" style="max-width: 500px; border-radius: 12px;">
    <div class="card-header text-center bg-primary text-white py-4" style="border-top-left-radius: 12px; border-top-right-radius: 12px;">
      <h2 class="mb-1">Register Yourself to view all our services</h2>
      <p class="text-white-50 mb-0">Fill in your details to get started with our services</p>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Name</label>
          <input type="text" class="form-control" id="name" formControlName="name" placeholder="Enter your full name">
        </div>
        
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" id="email" formControlName="email" placeholder="example@mail.com">
        </div>
        
        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold">Phone Number</label>
          <input type="tel" class="form-control" id="phone" formControlName="phoneNumber" placeholder="Enter your phone number">
        </div>
        
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary btn-lg shadow-sm" [disabled]="!registerForm.valid">
            Register
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
